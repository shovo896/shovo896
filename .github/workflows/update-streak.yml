name: Auto Update Coding Streak

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  update-streak:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Calculate GitHub contribution streak
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          GH_USER: shovo896

        run: |

          python <<'PY'

          import os
          import json
          import re
          import urllib.request

          from datetime import datetime, timezone, timedelta, date


          username = os.environ.get("GH_USER", "shovo896")
          token = os.environ["GH_TOKEN"]

          today = datetime.now(timezone.utc).date()


          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {

            user(login: $login) {

              contributionsCollection(
                from: $from,
                to: $to
              ) {

                contributionCalendar {

                  weeks {

                    contributionDays {
                      date
                      contributionCount
                    }

                  }

                }

              }

            }

          }
          """


          def fetch_year(year):

              variables = {

                  "login": username,

                  "from": f"{year}-01-01T00:00:00Z",

                  "to": f"{year}-12-31T23:59:59Z"

              }


              body = json.dumps({

                  "query": query,

                  "variables": variables

              }).encode()


              req = urllib.request.Request(

                  "https://api.github.com/graphql",

                  data=body,

                  headers={

                      "Authorization": f"Bearer {token}",

                      "Content-Type": "application/json",

                      "User-Agent":
                      "shovo896-profile-streak"

                  }

              )


              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  data = json.loads(
                      response.read().decode()
                  )


              if "errors" in data:
                  raise Exception(data["errors"])


              calendar = (
                  data["data"]["user"]
                      ["contributionsCollection"]
                      ["contributionCalendar"]
              )


              result = {}


              for week in calendar["weeks"]:

                  for day in week["contributionDays"]:

                      result[
                          date.fromisoformat(
                              day["date"]
                          )
                      ] = day[
                          "contributionCount"
                      ]


              return result


          days = {}


          # Three years, so a long streak crossing New Year
          # can still be calculated correctly.

          for year in [
              today.year - 2,
              today.year - 1,
              today.year
          ]:

              days.update(
                  fetch_year(year)
              )


          cursor = today


          # Do not reset the streak early in the day
          # before today's first contribution.

          if days.get(cursor, 0) == 0:

              cursor -= timedelta(days=1)


          streak = 0


          while days.get(cursor, 0) > 0:

              streak += 1

              cursor -= timedelta(days=1)


          print(
              f"Current streak = {streak} days"
          )


          readme_path = "README.md"


          with open(
              readme_path,
              "r",
              encoding="utf-8"
          ) as file:

              readme = file.read()


          new_section = f"""<!-- STREAK_START -->
          <p align="center">
            <img
              src="https://img.shields.io/badge/🔥%20CURRENT%20STREAK-{streak}%20DAYS-FF5722?style=for-the-badge&labelColor=0D1117"
              alt="GitHub Coding Streak"
            />
          </p>
          <!-- STREAK_END -->"""


          pattern = (
              r"<!-- STREAK_START -->"
              r".*?"
              r"<!-- STREAK_END -->"
          )


          updated = re.sub(

              pattern,

              new_section,

              readme,

              flags=re.DOTALL

          )


          if updated == readme:

              raise RuntimeError(
                  "STREAK markers were not found in README.md"
              )


          with open(
              readme_path,
              "w",
              encoding="utf-8"
          ) as file:

              file.write(updated)


          PY


      - name: Commit updated README

        run: |

          git config user.name \
          "github-actions[bot]"

          git config user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet
          then

            echo "No streak change"

          else

            git commit \
            -m "🔥 Update coding streak"

            git push

          fi
