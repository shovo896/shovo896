name: Auto Update Coding Streak

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Calculate streak and update README
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: shovo896
        run: |
          python <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import date, datetime, timedelta, timezone

          username = os.environ.get("GH_USER", "shovo896")
          token = os.environ["GH_TOKEN"]
          today = datetime.now(timezone.utc).date()

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          def fetch_year(year):
              variables = {
                  "login": username,
                  "from": f"{year}-01-01T00:00:00Z",
                  "to": f"{year}-12-31T23:59:59Z",
              }

              payload = json.dumps({
                  "query": query,
                  "variables": variables
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "shovo896-profile-streak-action",
                  },
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if result.get("errors"):
                  raise RuntimeError(result["errors"])

              user = result.get("data", {}).get("user")
              if not user:
                  raise RuntimeError(f"GitHub user '{username}' not found.")

              calendar = user["contributionsCollection"]["contributionCalendar"]

              year_days = {}
              for week in calendar["weeks"]:
                  for day in week["contributionDays"]:
                      year_days[date.fromisoformat(day["date"])] = int(
                          day["contributionCount"]
                      )

              return year_days

          contributions = {}

          # Read three years so a 404+ day streak can cross year boundaries.
          for year in (today.year - 2, today.year - 1, today.year):
              contributions.update(fetch_year(year))

          cursor = today

          # If there is no contribution yet today, preserve yesterday's streak.
          if contributions.get(cursor, 0) == 0:
              cursor -= timedelta(days=1)

          streak = 0

          while contributions.get(cursor, 0) > 0:
              streak += 1
              cursor -= timedelta(days=1)

          print(f"Current streak: {streak} days")

          readme_path = "README.md"

          with open(readme_path, "r", encoding="utf-8") as file:
              readme = file.read()

          start_marker = "<!-- STREAK_START -->"
          end_marker = "<!-- STREAK_END -->"

          if start_marker not in readme or end_marker not in readme:
              raise RuntimeError(
                  "README.md is missing STREAK_START or STREAK_END markers."
              )

          replacement = (
              "<!-- STREAK_START -->\n"
              '<p align="center">\n'
              "  <img\n"
              '    src="https://img.shields.io/badge/CURRENT%20STREAK-'
              f'{streak}%20DAYS-FF5722?style=for-the-badge&labelColor=0D1117"\n'
              '    alt="GitHub Coding Streak"\n'
              "  />\n"
              "</p>\n"
              "<!-- STREAK_END -->"
          )

          pattern = re.compile(
              r"<!-- STREAK_START -->.*?<!-- STREAK_END -->",
              re.DOTALL,
          )

          updated_readme = pattern.sub(replacement, readme, count=1)

          with open(readme_path, "w", encoding="utf-8", newline="\n") as file:
              file.write(updated_readme)

          print("README streak section updated.")
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No streak change. Nothing to commit."
            exit 0
          fi

          git commit -m "chore: update coding streak"
          git push
